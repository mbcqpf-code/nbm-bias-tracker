name: Daily NBM vs URMA Data & Bias Tracker

on:
  schedule:
    # Runs at 12:00 UTC every day
    - cron: '0 12 * * *'
  workflow_dispatch: 

jobs:
  build-and-plot:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install System Dependencies
        run: sudo apt-get install -y libeccodes0

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install 'herbie-data[extras]' xarray pandas numpy requests cfgrib netCDF4 h5netcdf matplotlib cartopy

      - name: Step 1 - Run Daily Data Collector
        run: python scripts/01_daily_compute.py

      - name: Step 2 - Run Rolling Average Plotter
        run: python scripts/02_average_compute.py

      - name: Step 3 - Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/1.1
          git add data_cache/ docs/
          git diff --staged --quiet || git commit -m "Automated daily data and plot update"
          git push
