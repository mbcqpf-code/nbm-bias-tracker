name: Daily NBM vs URMA Data Collector

on:
  schedule:
    # Runs at 12:00 UTC every day (Guarantees the 08z URMA is available)
    - cron: '0 12 * * *'
  workflow_dispatch: 
    # Allows you to click a "Run workflow" button manually on GitHub

jobs:
  build-archive:
    runs-on: ubuntu-latest
    
    # Required permission to push files back to your repository
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install System Dependencies (eccodes for cfgrib)
        run: sudo apt-get install -y libeccodes0

      - name: Install Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install 'herbie-data[extras]' xarray pandas numpy requests cfgrib netCDF4 h5netcdf

      - name: Run Daily Collector Script
        run: python scripts/01_daily_compute.py

      - name: Commit and Push New Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data_cache/
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "Automated daily data update"
          git push
